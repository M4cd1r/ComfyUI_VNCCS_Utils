name: Release

# Turns the "# Version [[NEXT]]" section of CHANGELOG.md into a numbered release,
# commits the version bump to main and publishes to the Comfy registry.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored when an explicit version is given)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version X.Y.Z (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Promote [[NEXT]] changelog section
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            VERSION=$(python scripts/release.py --notes-file "$RUNNER_TEMP/release_notes.md" --version "$EXPLICIT_VERSION")
          else
            VERSION=$(python scripts/release.py --notes-file "$RUNNER_TEMP/release_notes.md" --bump "$BUMP")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml README.md
          git commit -m "Release ${{ steps.release.outputs.version }}"
          git push origin HEAD:main
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping Discord announcement."
            exit 0
          fi
          # release.py splits the notes into Discord-sized files: release_notes_01.md, _02.md, ...
          post() {
            curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK_URL"
          }
          INDEX=0
          for FILE in "$RUNNER_TEMP"/release_notes_*.md; do
            INDEX=$((INDEX + 1))
            if [ "$INDEX" -eq 1 ]; then TITLE="VNCCS Utils $VERSION is out"; else TITLE="VNCCS Utils $VERSION (continued)"; fi
            jq -n --arg title "$TITLE" \
                  --arg url "https://registry.comfy.org/nodes/vnccs-utils" \
                  --rawfile desc "$FILE" \
                  '{embeds: [{title: $title, url: $url, description: $desc, color: 16748451}]}' > "$RUNNER_TEMP/discord.json"
            post || { echo "::warning::Discord announcement failed; the release itself succeeded."; exit 0; }
            sleep 1
          done
