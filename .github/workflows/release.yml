name: Release

# Turns the "# Version [[NEXT]]" section of CHANGELOG.md into a numbered release,
# commits the version bump to main and publishes to the Comfy registry.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored when an explicit version is given)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version X.Y.Z (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Promote [[NEXT]] changelog section
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            VERSION=$(python scripts/release.py --version "$EXPLICIT_VERSION")
          else
            VERSION=$(python scripts/release.py --bump "$BUMP")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml README.md
          git commit -m "Release ${{ steps.release.outputs.version }}"
          git push origin HEAD:main
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
